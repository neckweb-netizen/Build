# Project-wide Gradle settings.

# IDE (e.g. Android Studio) users:
# Gradle settings configured through the IDE *will override*
# any settings specified in this file.

# For more details on how to configure your build environment visit
# http://www.gradle.org/docs/current/userguide/build_environment.html

# Specifies the JVM arguments used for the daemon process.
# The setting is particularly useful for tweaking memory settings.
org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8 -XX:+HeapDumpOnOutOfMemoryError

# When configured, Gradle will run in incubating parallel mode.
# This option should only be used with decoupled projects.
# org.gradle.parallel=true

# AndroidX package structure to make it clearer which packages are bundled with the
# Android operating system, and which are packaged with your app's APK
android.useAndroidX=true
android.enableJetifier=true

# Disable AAPT2 daemon
android.enableAapt2=true
aapt2.daemon.enabled=false

# Kotlin settings
kotlin.code.style=official

# Capacitor variables
capacitorBuildToolsVersion=34.0.0
capacitorCompileSdkVersion=34
capacitorTargetSdkVersion=34
capacitorMinSdkVersion=22
androidxActivityVersion=1.9.0
androidxAppCompatVersion=1.7.0
androidxCoreVersion=1.15.0
androidxFragmentVersion=1.6.2
androidxLocalBroadcastManagerVersion=1.1.0
androidxWebkitVersion=1.8.0
googlePlayServicesAuthVersion=21.0.0
googlePlayServicesAuthApiPhoneVersion=18.0.2
googlePlayServicesBaseVersion=18.3.0
googlePlayServicesBasementVersion=18.3.0
googlePlayServicesTasksVersion=18.0.2
guavaVersion=32.1.3-android
kotlinVersion=1.9.20
materialVersion=1.12.0
kotlinxCoroutinesVersion=1.7.3
kotlinxSerializationVersion=1.5.1
constraintLayoutVersion=2.1.4
capacitorAndroidVersion=7.0.0
capacitorCordovaAndroidPluginsVersion=1.0.0
